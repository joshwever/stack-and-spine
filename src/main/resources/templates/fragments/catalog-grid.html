<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Full Catalog Grid Fragment -->
    <div th:fragment="grid"
         id="catalog-grid"
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 group-data-[expanded=true]/layout:lg:grid-cols-2 gap-4">
        <th:block th:each="item : ${items}">
            <article th:replace="~{fragments/catalog-grid :: card(${item})}"></article>
        </th:block>

        <div th:if="${#lists.isEmpty(items)}"
             class="col-span-full bg-slate-900/50 border border-dashed border-slate-800 rounded-xl p-8 text-center text-slate-400 text-sm">
            No media items match your filter. Add one using the + button in the top right!
        </div>

        <!-- Pagination Bar -->
        <nav th:if="${totalPages != null and totalPages > 1}"
             aria-label="Catalog pagination"
             class="col-span-full mt-2 flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-400">
            <span>
                Showing <strong class="text-slate-200" th:text="${showingFrom}">1</strong>–<strong class="text-slate-200" th:text="${showingTo}">48</strong>
                of <strong class="text-slate-200" th:text="${filteredCount}">2780</strong> items
                (Page <strong class="text-slate-200" th:text="${currentPage}">1</strong> of <strong class="text-slate-200" th:text="${totalPages}">58</strong>)
            </span>
            <div class="flex items-center gap-2">
                <button type="button"
                        th:if="${currentPage > 1}"
                        th:attr="hx-get=@{/(type=${selectedType != null ? selectedType.name() : ''},q=${query},page=${currentPage - 1})}"
                        hx-target="#catalog-grid"
                        hx-swap="outerHTML"
                        hx-push-url="true"
                        onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
                        class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                    ← Previous
                </button>
                <button type="button"
                        th:if="${currentPage < totalPages}"
                        th:attr="hx-get=@{/(type=${selectedType != null ? selectedType.name() : ''},q=${query},page=${currentPage + 1})}"
                        hx-target="#catalog-grid"
                        hx-swap="outerHTML"
                        hx-push-url="true"
                        onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
                        class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">
                    Next →
                </button>
            </div>
        </nav>
    </div>

    <!-- Single Media Item Card Fragment -->
    <article th:fragment="card(item)"
             th:id="'item-card-' + ${item.id}"
             class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between hover:border-slate-700 transition">
        <div>
            <div class="flex items-start justify-between gap-2 mb-2">
                <span th:switch="${item.mediaType.name()}">
                    <span th:case="'BOOK'" class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-indigo-950 text-indigo-300 border border-indigo-800">Book</span>
                    <span th:case="'EBOOK'" class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-violet-950 text-violet-300 border border-violet-800">E-Book</span>
                    <span th:case="'BLU_RAY'" class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-sky-950 text-sky-300 border border-sky-800">Blu-Ray</span>
                    <span th:case="'DVD'" class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-amber-950 text-amber-300 border border-amber-800">DVD</span>
                </span>
                <span class="text-xs text-slate-400 font-mono" th:if="${item.releaseYear != null}" th:text="${item.releaseYear}">2020</span>
            </div>

            <div th:if="${item.coverImageUrl != null and !item.coverImageUrl.isEmpty()}"
                 class="mb-3 rounded-lg overflow-hidden border border-slate-800 bg-slate-950 flex items-center justify-center max-h-48">
                <img th:src="${item.coverImageUrl}"
                     th:alt="${item.title + ' cover'}"
                     loading="lazy"
                     onerror="this.parentElement.style.display='none'"
                     class="max-h-48 w-auto object-contain">
            </div>

            <h2 class="text-base font-semibold text-white leading-snug" th:text="${item.title}">Media Title</h2>
            <p class="text-sm text-slate-400 mt-0.5" th:text="${item.creator}">Creator</p>

            <div class="mt-3 space-y-1 text-xs text-slate-400">
                <div th:if="${item.genre != null and !item.genre.isEmpty()}">
                    <span class="text-slate-500">Genre:</span>
                    <span class="text-slate-300" th:text="${item.genre}">Sci-Fi</span>
                </div>
                <div th:if="${item.identifierCode != null and !item.identifierCode.isEmpty()}">
                    <span class="text-slate-500">ISBN/UPC:</span>
                    <span class="font-mono text-slate-300" th:text="${item.identifierCode}">978-0000000000</span>
                </div>
                <div th:if="${item.shelfLocation != null and !item.shelfLocation.isEmpty()}">
                    <span class="text-slate-500">Shelf:</span>
                    <span class="text-emerald-400" th:text="${item.shelfLocation}">Shelf A1</span>
                </div>
            </div>

            <!-- Dynamic Type-Specific Attributes -->
            <div th:if="${item.attributes != null and !item.attributes.isEmpty()}"
                 class="mt-3 pt-3 border-t border-slate-800/80 flex flex-wrap gap-1.5">
                <span th:each="entry : ${item.attributes}"
                      class="px-2 py-0.5 rounded bg-slate-950 border border-slate-800 text-[11px] text-slate-300">
                    <span class="text-slate-500" th:text="${entry.key + ':'}">Key:</span>
                    <span th:text="${entry.value}">Val</span>
                </span>
            </div>
        </div>

        <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between gap-2">
            <div th:if="${gcsEnabled}" class="flex items-center gap-3">
                <form th:action="@{/items/{id}/cover(id=${item.id})}"
                      method="post"
                      enctype="multipart/form-data"
                      class="flex items-center">
                    <label class="text-xs text-sky-400 hover:text-sky-300 cursor-pointer">
                        <span th:text="${item.coverObjectPath != null ? 'Replace Cover' : 'Upload Cover'}">Upload Cover</span>
                        <input type="file"
                               name="file"
                               accept="image/jpeg,image/png,image/webp,image/gif"
                               class="hidden"
                               onchange="this.form.submit()">
                    </label>
                </form>
                <form th:if="${item.coverObjectPath == null and (item.mediaType.name() == 'BOOK' or item.mediaType.name() == 'EBOOK') and item.identifierCode != null and !item.identifierCode.isEmpty()}"
                      th:action="@{/items/{id}/cover/fetch(id=${item.id})}"
                      method="post"
                      class="flex items-center">
                    <button type="submit" class="text-xs text-emerald-400 hover:text-emerald-300">
                        Fetch to GCS
                    </button>
                </form>
                <span th:if="${item.coverObjectPath != null}"
                      title="Archived in private Google Cloud Storage bucket (served via V4 Signed URL)"
                      class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-mono">
                    GCS
                </span>
            </div>
            <span th:unless="${gcsEnabled}"></span>
            <div class="flex items-center gap-3">
                <button type="button"
                        th:attr="hx-get=@{/items/{id}/edit(id=${item.id})},hx-target='#item-card-' + ${item.id}"
                        hx-swap="outerHTML"
                        class="text-xs text-indigo-400 hover:text-indigo-300">
                    Edit
                </button>
                <button type="button"
                        th:attr="hx-delete=@{/items/{id}(id=${item.id})},hx-target='#item-card-' + ${item.id}"
                        hx-swap="outerHTML"
                        class="text-xs text-rose-400 hover:text-rose-300">
                    Remove
                </button>
            </div>
        </div>
    </article>
</body>
</html>
