<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Inline HTMX Edit Card Fragment -->
    <article th:fragment="editCard"
             th:id="'item-card-' + ${item.id}"
             class="bg-slate-900 border border-indigo-500/60 rounded-xl p-5 shadow-lg shadow-indigo-950/40">
        <form th:attr="hx-post=@{/items/{id}(id=${item.id})},hx-target='#item-card-' + ${item.id}"
              hx-swap="outerHTML"
              class="space-y-3 text-xs">
            <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-800">
                <span class="text-xs font-semibold text-indigo-300">Edit Media Item</span>
                <select name="mediaType" required
                        class="rounded-md bg-slate-950 border border-slate-700 px-2 py-1 text-xs text-slate-100">
                    <option th:each="mt : ${mediaTypes}"
                            th:value="${mt.name()}"
                            th:text="${mt.displayName}"
                            th:selected="${mt == item.mediaType}">Book</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Title *</label>
                <input type="text" name="title" required th:value="${item.title}"
                       class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100">
            </div>

            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Author / Director *</label>
                <input type="text" name="creator" required th:value="${item.creator}"
                       class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Year</label>
                    <input type="number" name="releaseYear" th:value="${item.releaseYear}"
                           class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Genre</label>
                    <input type="text" name="genre" th:value="${item.genre}"
                           class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">ISBN / UPC</label>
                    <input type="text" name="identifierCode" th:value="${item.identifierCode}"
                           class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100 font-mono">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Shelf Location</label>
                    <input type="text" name="shelfLocation" th:value="${item.shelfLocation}"
                           class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100">
                </div>
            </div>

            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Description</label>
                <textarea name="description" rows="2"
                          th:text="${item.description}"
                          placeholder="Brief synopsis..."
                          class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100 text-[11px]"></textarea>
            </div>

            <div>
                <label class="block text-[11px] text-slate-400 mb-1">Attributes (one <code>Key: Value</code> per line)</label>
                <textarea name="attributesText" rows="3"
                          th:text="${attributesText}"
                          placeholder="Format: Hardcover&#10;Pages: 412"
                          class="w-full rounded-md bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-slate-100 font-mono text-[11px]"></textarea>
            </div>

            <div class="pt-2 border-t border-slate-800 flex items-center justify-end gap-2">
                <button type="button"
                        th:attr="hx-get=@{/items/{id}/card(id=${item.id})},hx-target='#item-card-' + ${item.id}"
                        hx-swap="outerHTML"
                        class="px-3 py-1.5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                    Cancel
                </button>
                <button type="submit"
                        class="px-3 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">
                    Save Changes
                </button>
            </div>
        </form>
    </article>

    <!-- Returned on Save: replaces the edited card + out-of-band updates header stats pills -->
    <th:block th:fragment="updatedCardWithStats">
        <article th:replace="~{fragments/catalog-grid :: card(${item})}"></article>
        <div th:replace="~{fragments/header :: stats(true)}"></div>
    </th:block>
</body>
</html>
