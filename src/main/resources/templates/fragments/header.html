<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-600/30">
                    S&amp;S
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Stack &amp; Spine</h1>
                    <p class="text-xs text-slate-400">
                        Storage Backend:
                        <span class="text-emerald-400 font-mono" th:text="${storageBackend}">In-Memory</span>
                        <span th:if="${authenticatedUser != null}" class="ml-2 pl-2 border-l border-slate-700 text-sky-400">
                            <span th:text="${authSource ?: 'User'}">IAP</span>:
                            <span class="font-mono" th:text="${authenticatedUser}">user@example.com</span>
                        </span>
                        <form th:if="${identityPlatformSession}" method="post" action="/auth/logout" class="inline ml-2 pl-2 border-l border-slate-700">
                            <button type="submit" class="text-slate-300 hover:text-white underline cursor-pointer">Sign Out</button>
                        </form>
                        <a th:if="${!identityPlatformSession}" href="/login" class="ml-2 pl-2 border-l border-slate-700 text-indigo-400 hover:text-indigo-300 underline">
                            Sign In
                        </a>
                    </p>
                </div>
            </div>

            <div th:replace="~{fragments/header :: stats(false)}"></div>
        </div>
    </header>

    <!-- Stats Pills (clickable to filter catalog; supports out-of-band HTMX swap when oob=true) -->
    <div th:fragment="stats(oob)"
         id="stats-pills"
         th:attr="hx-swap-oob=${oob ? 'true' : null}"
         class="flex flex-wrap items-center gap-2 text-xs">
        <button type="button"
                data-filter-type=""
                onclick="filterByType('')"
                th:classappend="${selectedType == null} ? ' ring-2 ring-white/40' : ''"
                class="px-3 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 transition cursor-pointer">
            Total: <strong th:text="${totalCount}">0</strong>
        </button>
        <button type="button"
                data-filter-type="BOOK"
                onclick="filterByType('BOOK')"
                th:classappend="${selectedType != null and selectedType.name() == 'BOOK'} ? ' ring-2 ring-indigo-400' : ''"
                class="px-3 py-1.5 rounded-full bg-indigo-950 hover:bg-indigo-900/80 text-indigo-300 border border-indigo-800/60 transition cursor-pointer">
            Books: <strong th:text="${bookCount}">0</strong>
        </button>
        <button type="button"
                data-filter-type="EBOOK"
                onclick="filterByType('EBOOK')"
                th:classappend="${selectedType != null and selectedType.name() == 'EBOOK'} ? ' ring-2 ring-violet-400' : ''"
                class="px-3 py-1.5 rounded-full bg-violet-950 hover:bg-violet-900/80 text-violet-300 border border-violet-800/60 transition cursor-pointer">
            E-Books: <strong th:text="${ebookCount}">0</strong>
        </button>
        <button type="button"
                data-filter-type="BLU_RAY"
                onclick="filterByType('BLU_RAY')"
                th:classappend="${selectedType != null and selectedType.name() == 'BLU_RAY'} ? ' ring-2 ring-sky-400' : ''"
                class="px-3 py-1.5 rounded-full bg-sky-950 hover:bg-sky-900/80 text-sky-300 border border-sky-800/60 transition cursor-pointer">
            Blu-Ray: <strong th:text="${bluRayCount}">0</strong>
        </button>
        <button type="button"
                data-filter-type="DVD"
                onclick="filterByType('DVD')"
                th:classappend="${selectedType != null and selectedType.name() == 'DVD'} ? ' ring-2 ring-amber-400' : ''"
                class="px-3 py-1.5 rounded-full bg-amber-950 hover:bg-amber-900/80 text-amber-300 border border-amber-800/60 transition cursor-pointer">
            DVD: <strong th:text="${dvdCount}">0</strong>
        </button>
    </div>
</body>
</html>
