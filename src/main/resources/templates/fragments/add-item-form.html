<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="addItemForm"
           id="add-item-aside"
           class="lg:col-span-1 group-data-[expanded=true]/layout:lg:row-span-2 bg-slate-900 border border-slate-800 rounded-xl p-4 h-fit">
        <div class="flex items-center justify-between gap-3">
            <div>
                <h2 class="text-sm font-semibold text-white leading-tight">Add to Collection</h2>
                <p class="text-xs text-slate-400 mt-0.5">Add manually or AI-scan a cover photo.</p>
                <p th:if="${gcsEnabled and aiScanQuota != null and !aiScanQuota.unlimited}"
                   class="text-[11px] mt-1"
                   th:classappend="${aiScanQuota.remaining == 0} ? ' text-amber-400' : ' text-slate-500'">
                    AI Scans today:
                    <strong th:text="${aiScanQuota.remaining}">15</strong>/<span th:text="${aiScanQuota.dailyLimit}">15</span> remaining
                </p>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <form th:if="${gcsEnabled}"
                      action="/inbox/scan"
                      method="post"
                      enctype="multipart/form-data"
                      class="flex items-center">
                    <label th:with="exhausted=${aiScanQuota != null and !aiScanQuota.unlimited and aiScanQuota.remaining == 0}"
                           th:title="${exhausted} ? 'Daily AI Scan limit reached (resets midnight UTC)' : 'Snap a cover or spine photo with your camera (auto-cropped by Gemini AI)'"
                           th:class="${exhausted} ? 'h-9 px-3 shrink-0 whitespace-nowrap rounded-lg bg-slate-800/60 border border-slate-700 text-slate-500 flex items-center justify-center text-xs font-medium cursor-not-allowed' : 'h-9 px-3 shrink-0 whitespace-nowrap rounded-lg bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500/40 text-emerald-300 hover:text-white flex items-center justify-center text-xs font-medium cursor-pointer transition'">
                        AI Scan
                        <input type="file"
                               name="file"
                               accept="image/*"
                               capture="environment"
                               th:disabled="${exhausted}"
                               class="hidden"
                               onchange="this.form.submit()">
                    </label>
                </form>
                <form th:if="${gcsEnabled}"
                      action="/inbox/scan"
                      method="post"
                      enctype="multipart/form-data"
                      class="flex items-center">
                    <label th:with="exhausted=${aiScanQuota != null and !aiScanQuota.unlimited and aiScanQuota.remaining == 0}"
                           th:title="${exhausted} ? 'Daily AI Scan limit reached (resets midnight UTC)' : 'Pick an existing or document-scanned photo from your gallery for AI cataloging'"
                           th:class="${exhausted} ? 'h-9 px-3 shrink-0 whitespace-nowrap rounded-lg bg-slate-800/60 border border-slate-700 text-slate-500 flex items-center justify-center text-xs font-medium cursor-not-allowed' : 'h-9 px-3 shrink-0 whitespace-nowrap rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-xs font-medium cursor-pointer transition'">
                        Photos
                        <input type="file"
                               name="file"
                               accept="image/*"
                               th:disabled="${exhausted}"
                               class="hidden"
                               onchange="this.form.submit()">
                    </label>
                </form>
                <button type="button"
                        id="toggle-add-form-btn"
                        aria-expanded="false"
                        aria-controls="add-item-form"
                        title="Expand Add to Collection form"
                        onclick="toggleAddItemForm()"
                        class="h-9 w-9 shrink-0 rounded-lg bg-indigo-600/20 hover:bg-indigo-600 border border-indigo-500/40 text-indigo-300 hover:text-white flex items-center justify-center text-xl font-semibold leading-none transition focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <span id="toggle-add-form-icon" class="inline-block transition-transform duration-200">+</span>
                </button>
            </div>
        </div>

        <form id="add-item-form" method="post" action="/items" class="hidden mt-4 pt-4 border-t border-slate-800 space-y-3.5 text-sm">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Media Type *</label>
                <select id="add-media-type" name="mediaType" required
                        class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100">
                    <option th:each="mt : ${mediaTypes}" th:value="${mt.name()}" th:text="${mt.displayName}">Book</option>
                </select>
            </div>

            <!-- Metadata Auto-Fill (OpenLibrary for Books / TMDB via Secret Manager for Discs) -->
            <div class="rounded-lg bg-slate-950/70 border border-slate-800 p-2.5 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-indigo-300">Auto-Fill Metadata</span>
                    <span class="text-[10px] text-slate-500">ISBN (OpenLibrary) / Title (TMDB)</span>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="lookup-query"
                           autocomplete="off"
                           placeholder="ISBN or Book / Movie Title"
                           onkeydown="if (event.key === 'Enter') { event.preventDefault(); lookupMetadata(); }"
                           class="flex-1 min-w-0 rounded-md bg-slate-900 border border-slate-800 px-2.5 py-1.5 text-xs text-slate-100">
                    <button type="button"
                            onclick="lookupMetadata()"
                            class="px-2.5 py-1.5 rounded-md bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/40 text-xs text-indigo-200 hover:text-white transition">
                        Lookup
                    </button>
                </div>
                <p id="lookup-status" class="text-[11px] text-slate-400 hidden"></p>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Title *</label>
                <input type="text" name="title" required placeholder="e.g., Neuromancer or The Matrix"
                       class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Author / Director *</label>
                <input type="text" name="creator" required placeholder="e.g., William Gibson"
                       class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Release Year</label>
                    <input type="number" name="releaseYear" placeholder="1984"
                           class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Genre</label>
                    <input type="text" name="genre" placeholder="Sci-Fi"
                           class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ISBN / UPC Code</label>
                    <input type="text" name="identifierCode" placeholder="978-0441569595"
                           class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100 font-mono text-xs">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Shelf Location</label>
                    <input type="text" name="shelfLocation" placeholder="Study - B2"
                           class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100">
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Description</label>
                <textarea name="description" rows="2" placeholder="Brief synopsis..."
                          class="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs text-slate-100"></textarea>
            </div>

            <div class="pt-2 border-t border-slate-800">
                <p class="text-xs text-slate-400 mb-2">Custom Attributes (Pages, Resolution, Region, etc.)</p>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" name="attrKey1" placeholder="e.g., Resolution"
                           class="rounded-lg bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs text-slate-100">
                    <input type="text" name="attrVal1" placeholder="e.g., 4K UHD"
                           class="rounded-lg bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs text-slate-100">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" name="attrKey2" placeholder="e.g., Audio / Pages"
                           class="rounded-lg bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs text-slate-100">
                    <input type="text" name="attrVal2" placeholder="e.g., Dolby Atmos"
                           class="rounded-lg bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs text-slate-100">
                </div>
            </div>

            <button type="submit"
                    class="w-full mt-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 text-sm shadow-lg shadow-indigo-600/25 transition">
                Save Media Item
            </button>
        </form>
    </aside>
</body>
</html>
