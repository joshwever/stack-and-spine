<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack &amp; Spine — Mixed Media Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Top Header + Stats Pills -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main id="main-layout"
          data-expanded="false"
          class="group/layout max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 lg:grid-rows-[auto_1fr] gap-6 items-start">
        <!-- Top-Left: Search & Filter Bar -->
        <form th:replace="~{fragments/search-bar :: searchBar}"></form>

        <!-- Top-Right / Right Column: Collapsible Add New Item Form -->
        <aside th:replace="~{fragments/add-item-form :: addItemForm}"></aside>

        <!-- Catalog Cards Section (full width when form is minimized, 2 columns when expanded) -->
        <section id="catalog-section" class="lg:col-span-3 group-data-[expanded=true]/layout:lg:col-span-2">
            <div th:replace="~{fragments/catalog-grid :: grid}"></div>
        </section>
    </main>

    <script th:src="@{/js/catalog.js(v=2)}"></script>
</body>
</html>
