plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.cloud.tools.jib' version '3.4.5'
}

group = 'com.stackandspine'
version = '0.0.1-SNAPSHOT'
description = 'Stack and Spine - Mixed Media Catalog (DVD, Blu-Ray, Books) on GCP'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudGcpVersion', '6.1.1')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Google Cloud Firestore SDK (we will wire up Firestore in Phase 2 while learning ADC & IAM!)
    implementation 'com.google.cloud:google-cloud-firestore'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "com.google.cloud:spring-cloud-gcp-dependencies:${springCloudGcpVersion}"
    }
}

jib {
    from {
        image = 'eclipse-temurin:25-jre'
    }
    to {
        image = 'us-central1-docker.pkg.dev/project-f2e57f3d-860e-486f-a44/stack-and-spine/stack-and-spine:latest'
    }
    container {
        mainClass = 'com.stackandspine.StackAndSpineApplication'
        ports = ['8080']
        environment = [
            'JAVA_TOOL_OPTIONS': '-XX:MaxRAMPercentage=75.0'
        ]
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
